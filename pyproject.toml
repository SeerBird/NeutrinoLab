[project]
name = "NeutrinoLab"
version = "0.0.1"
description = "Meow meow"
requires-python = ">=3.12"
dependencies = ["numpy", "matplotlib", "zfit", "scikit-learn", "xgboost", "black", "pylint"]

[tool.black]
line-length = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["."]
